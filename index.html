<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#06120d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="STIFF"><link rel="manifest" href="manifest.webmanifest"><title>STIFF</title><style>
:root{--bg:#04100b;--panel:#0a1912;--panel2:#102219;--line:#263c31;--green:#69ed8c;--green2:#39d66c;--text:#f7faf8;--muted:#aebbb3;--safe:env(safe-area-inset-bottom,0px)}*{box-sizing:border-box}html,body{margin:0;background:#020806;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Arial,sans-serif;min-height:100%;overscroll-behavior:none}body{display:flex;justify-content:center}.app{width:100%;max-width:520px;min-height:100dvh;background:radial-gradient(circle at 50% -10%,#123425 0,#06130d 35%,#030b08 70%);position:relative;padding-bottom:calc(84px + var(--safe))}.top{height:70px;padding:18px 20px 10px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20;background:linear-gradient(#04100bf2,#04100bcc,transparent);backdrop-filter:blur(10px)}.brand{font-size:29px;font-weight:1000;font-style:italic;letter-spacing:1px}.iconbtn{border:0;background:transparent;color:#fff;font-size:27px;padding:6px}.content{padding:8px 18px 24px}.eyebrow{color:var(--green);font-size:13px;font-weight:800}.hero h1{font-size:36px;line-height:1.03;margin:8px 0}.hero p{color:var(--muted);line-height:1.55;margin:0 0 18px}.progress{height:8px;background:#213029;border-radius:99px;overflow:hidden}.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--green2),var(--green));border-radius:inherit}.phase-card,.lesson,.resource,.stat{border:1px solid var(--line);background:linear-gradient(135deg,#102119,#0a1711);border-radius:16px}.phase-card{display:grid;grid-template-columns:48px 1fr 28px;gap:12px;align-items:center;padding:12px;margin:10px 0;box-shadow:0 10px 28px #0004}.phase-card.active{border-color:#4dde77;box-shadow:0 0 0 1px #42e97766,0 0 22px #38df6e25}.num{width:44px;height:44px;border:1px solid #355545;border-radius:13px;display:grid;place-items:center;font-size:21px;font-weight:900;background:#0c1c14}.phase-card.active .num{background:#153e27}.phase-card b{font-size:15px}.small{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.3}.chev{font-size:27px;color:#c7ffd5}.tabs{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:13px;overflow:hidden;margin:16px 0}.tabs button{border:0;padding:11px;background:transparent;color:#fff;font-weight:800}.tabs button.on{background:var(--green);color:#05120b}.lesson{display:grid;grid-template-columns:56px 1fr 24px;gap:12px;align-items:center;padding:10px;margin:9px 0}.thumb{width:56px;height:48px;border-radius:9px;background:linear-gradient(135deg,#274636,#102017);display:grid;place-items:center;color:var(--green);font-size:22px;overflow:hidden}.lesson.done .thumb:after{content:'✓';font-weight:900}.lesson h3{font-size:14px;margin:0}.viewer{padding-bottom:92px}.viewer-head{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin:2px 0 16px}.viewer h1{font-size:30px;line-height:1.08;margin:0 0 8px}.media{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#07110c;margin:18px 0;min-height:260px;display:grid;place-items:center}.media img{display:block;width:100%;height:auto;max-height:70dvh;object-fit:contain}.media.crop-ui{max-height:68dvh;overflow:hidden}.media.crop-ui img{margin-bottom:-76px}.media iframe{border:0;width:100%;height:62dvh;min-height:420px;background:#000}.native-note{color:var(--muted);font-size:13px;line-height:1.45}.viewer-nav{position:fixed;bottom:calc(72px + var(--safe));left:50%;transform:translateX(-50%);width:min(520px,100%);padding:10px 18px;display:flex;gap:12px;z-index:30;background:linear-gradient(transparent,#030b08 25%)}.btn{flex:1;border-radius:14px;padding:14px;border:1px solid #557065;background:#07110c;color:#fff;font-weight:900;font-size:15px}.btn.primary{background:var(--green);border-color:var(--green);color:#05110a}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);height:calc(70px + var(--safe));padding:7px 10px var(--safe);display:grid;grid-template-columns:repeat(4,1fr);background:#06110dec;border-top:1px solid #22372d;backdrop-filter:blur(16px);z-index:25}.nav{border:0;background:none;color:#aab8b0;font-size:10px;font-weight:700}.nav span{display:block;font-size:23px;line-height:28px}.nav.on{color:var(--green)}.section-title{font-size:22px;margin:24px 0 10px}.resource{padding:14px;margin:9px 0}.resource b{display:block;margin-bottom:5px}.pill{display:inline-block;padding:5px 9px;border-radius:99px;background:#153623;color:#8ff3aa;font-size:11px;font-weight:800}.empty{color:var(--muted);text-align:center;padding:40px 10px}.complete{padding:28px 18px;text-align:center}.trophy{font-size:70px;color:var(--green)}.complete h1{font-size:38px;margin:10px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px 0}.stat{padding:16px}.stat strong{font-size:25px;color:var(--green)}@media(min-width:700px){body{padding:20px}.app{border:1px solid #315642;border-radius:30px;overflow:hidden;min-height:calc(100dvh - 40px)}.bottom,.viewer-nav{max-width:520px}}
</style></head><body><main class="app"><header class="top"><button class="iconbtn" id="backTop" aria-label="Back">‹</button><div class="brand">STIFF</div><button class="iconbtn" id="menuTop">⋯</button></header><section id="view" class="content"></section><nav class="bottom"><button class="nav on" data-page="home"><span>⌂</span>Home</button><button class="nav" data-page="phases"><span>▤</span>Phases</button><button class="nav" data-page="progress"><span>▥</span>Progress</button><button class="nav" data-page="resources"><span>⚙</span>Resources</button></nav></main><script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];let D,route={page:'home'},history=[];const done=()=>JSON.parse(localStorage.getItem('stiffComplete')||'{}'),save=o=>localStorage.setItem('stiffComplete',JSON.stringify(o));const thumb=id=>`https://drive.google.com/thumbnail?id=${id}&sz=w2400`,preview=id=>`https://drive.google.com/file/d/${id}/preview`;
function nav(r,push=true){if(push)history.push({...route});route=r;render();scrollTo(0,0)}function setNav(p){$$('.nav').forEach(x=>x.classList.toggle('on',x.dataset.page===p))}function phasePct(p){let o=done(),a=p.items||[],n=a.filter(x=>o[x.folder]).length;return a.length?Math.round(n/a.length*100):0}function totalPct(){let a=D.phases.flatMap(p=>p.items),o=done(),n=a.filter(x=>o[x.folder]).length;return Math.round(n/a.length*100)}
function home(){setNav('home');let pct=totalPct();return `<div class="hero"><div class="eyebrow">PRIVATE PROGRAMME</div><h1>Your nine-phase course</h1><p>Your personal programme, organised into learning, practical exercises and saved media. Work through it at a pace you can maintain and repeat the exercises that help most.</p><div class="progress"><i style="width:${pct}%"></i></div><div class="small" style="margin:8px 0 22px">${pct}% overall progress</div></div><h2 class="section-title">Continue your programme</h2>${D.phases.map(p=>phaseCard(p)).join('')}`}
function phaseCard(p){let pc=phasePct(p);return `<article class="phase-card ${pc>0&&pc<100?'active':''}" onclick="nav({page:'phase',phase:${p.phase}})"><div class="num">${p.phase}</div><div><b>Phase ${p.phase}</b><div class="small">${p.description}</div><div class="progress" style="margin-top:8px"><i style="width:${pc}%"></i></div></div><div class="chev">›</div></article>`}
function phases(){setNav('phases');return `<div class="hero"><div class="eyebrow">9 PHASES</div><h1>Programme</h1><p>Real knowledge, practical exercises and your saved media in the original phase order.</p></div>${D.phases.map(phaseCard).join('')}`}
function phase(){setNav('phases');let p=D.phases.find(x=>x.phase===route.phase),o=done(),items=p.items.filter(x=>!route.tab||route.tab==='all'||x.type===route.tab);return `<div class="eyebrow">PHASE ${p.phase}</div><div class="hero"><h1>Phase ${p.phase}</h1><p>${p.description}</p><div class="progress"><i style="width:${phasePct(p)}%"></i></div></div><div class="tabs"><button class="${route.tab!=='exercise'?'on':''}" onclick="nav({...route,tab:'learn'})">Learn</button><button class="${route.tab==='exercise'?'on':''}" onclick="nav({...route,tab:'exercise'})">Exercise</button></div>${items.map((x,i)=>`<article class="lesson ${o[x.folder]?'done':''}" onclick="openLesson('${x.folder}',${p.phase})"><div class="thumb">${x.type==='exercise'?'◎':'▶'}</div><div><h3>${x.n}. ${x.title}</h3><div class="small">${x.meta|| (x.type==='exercise'?'Exercise':'Learning')}</div></div><div class="chev">›</div></article>`).join('')||'<div class="empty">No items in this section.</div>'}`}
function openLesson(folder,phase){let seq=D.screenSequences[folder]||[];nav({page:'viewer',folder,phase,idx:0,total:seq.length})}function viewer(){setNav('phases');let seq=D.screenSequences[route.folder]||[],m=seq[route.idx],p=D.phases.find(x=>x.phase===route.phase),item=p.items.find(x=>x.folder===route.folder)||{title:'Lesson'};if(!m)return '<div class="empty">No saved pages found for this item.</div>';let media=m.type==='image'?`<div class="media crop-ui"><img src="${thumb(m.id)}" alt="Saved course page ${m.n}"></div>`:`<div class="media"><iframe allow="autoplay; fullscreen" allowfullscreen src="${preview(m.id)}"></iframe></div>`;return `<div class="viewer"><div class="viewer-head"><span>Phase ${route.phase}</span><span>${route.idx+1} of ${seq.length}</span></div><h1>${item.title}</h1><div class="small">${m.type==='image'?'Saved lesson page':m.type==='video'?'Video':'Audio'} · item ${m.n}</div>${media}<div class="native-note">The app’s own navigation is shown below. Saved screenshot navigation is cropped from the viewer so you only use STIFF’s Back and Next controls.</div></div><div class="viewer-nav"><button class="btn" onclick="prevMedia()">← Back</button><button class="btn primary" onclick="nextMedia()">${route.idx===seq.length-1?'Complete':'Next →'}</button></div>`}
function prevMedia(){if(route.idx>0){route.idx--;render();scrollTo(0,0)}else nav({page:'phase',phase:route.phase})}function nextMedia(){let seq=D.screenSequences[route.folder]||[];if(route.idx<seq.length-1){route.idx++;render();scrollTo(0,0)}else{let o=done();o[route.folder]=true;save(o);nav({page:'complete',phase:route.phase,folder:route.folder})}}
function complete(){setNav('progress');let p=D.phases.find(x=>x.phase===route.phase),pc=phasePct(p);return `<div class="complete"><div class="trophy">♜</div><div class="eyebrow">WELL DONE</div><h1>Lesson complete</h1><p class="small">Your progress has been saved on this device.</p><div class="progress" style="margin:25px 0 8px"><i style="width:${pc}%"></i></div><b>${pc}% of Phase ${p.phase}</b><button class="btn primary" style="width:100%;margin-top:30px" onclick="nav({page:'phase',phase:${p.phase}})">Continue Phase ${p.phase} →</button></div>`}
function progress(){setNav('progress');let pct=totalPct(),all=D.phases.flatMap(p=>p.items),o=done(),n=all.filter(x=>o[x.folder]).length;return `<div class="hero"><div class="eyebrow">YOUR PROGRESS</div><h1>${pct}% complete</h1><p>Progress is stored privately in this browser.</p></div><div class="stats"><div class="stat"><strong>${n}</strong><div class="small">Items completed</div></div><div class="stat"><strong>${all.length-n}</strong><div class="small">Items remaining</div></div></div>${D.phases.map(p=>phaseCard(p)).join('')}`}
function resources(){setNav('resources');let r=D.resources;return `<div class="hero"><div class="eyebrow">LIBRARY</div><h1>Resources</h1><p>Your exercises, courses and saved sessions in one place.</p></div><h2 class="section-title">Exercises</h2>${r.exercises.map(x=>`<article class="resource" onclick="openLesson('${x.folder}',${x.phase})"><b>${x.title}</b><span class="pill">Phase ${x.phase}</span> <span class="small">${x.meta||''}</span></article>`).join('')}<h2 class="section-title">Courses</h2>${r.courses.map(x=>`<article class="resource" onclick="openLesson('${x.folder}',${x.phase})"><b>${x.title}</b><span class="pill">Phase ${x.phase}</span></article>`).join('')}<h2 class="section-title">Meditations</h2>${r.meditations.map(x=>`<article class="resource"><b>${x}</b><div class="small">Saved programme resource</div></article>`).join('')}<h2 class="section-title">Therapy sessions</h2>${r.therapyPodcasts.map(x=>`<article class="resource"><b>${x}</b><div class="small">Saved programme resource</div></article>`).join('')}`}
function render(){let v=route.page==='home'?home():route.page==='phases'?phases():route.page==='phase'?phase():route.page==='viewer'?viewer():route.page==='complete'?complete():route.page==='progress'?progress():resources();$('#view').innerHTML=v;$('#backTop').style.visibility=route.page==='home'?'hidden':'visible'}
$('#backTop').onclick=()=>{let x=history.pop();if(x){route=x;render();scrollTo(0,0)}else nav({page:'home'},false)};$('#menuTop').onclick=()=>nav({page:'resources'});$$('.nav').forEach(x=>x.onclick=()=>nav({page:x.dataset.page}));fetch('course-data.json').then(r=>r.json()).then(x=>{D=x;render()}).catch(()=>$('#view').innerHTML='<div class="empty">Could not load course-data.json. Keep it beside index.html.</div>');if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
